                  type="button"
                  onClick={() => handleSendChatMessage('Why was my document flagged?')}
                  className="px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-400 text-slate-700 dark:text-slate-300 transition cursor-pointer"
                >
                  ❓ Why flagged?
                </button>
                <button
                  type="button"
                  onClick={() => handleSendChatMessage('What documents can I submit?')}
                  className="px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-400 text-slate-700 dark:text-slate-300 transition cursor-pointer"
                >
                  📄 Accepted Docs
                </button>
                <button
                  type="button"
                  onClick={() => handleSendChatMessage('How does AI fake document detection work?')}
                  className="px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-400 text-slate-700 dark:text-slate-300 transition cursor-pointer"
                >
                  🔍 AI Forensics
                </button>
                <button
                  type="button"
                  onClick={() => handleSendChatMessage('How do I fix portrait mismatch?')}
                  className="px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-400 text-slate-700 dark:text-slate-300 transition cursor-pointer"
                >
                  👤 Face Mismatch
                </button>
              </div>

              {/* Chat Messages Thread */}
              <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3 text-xs">
                {chatMessages.map((msg) => (
                  <div
                    key={msg.id}
                    className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}
                  >
                    <div
                      className={`max-w-[88%] p-3 rounded-2xl shadow-sm text-xs leading-relaxed ${
                        msg.sender === 'user'
                          ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-tr-none'
                          : 'bg-slate-100 dark:bg-slate-800/90 text-slate-800 dark:text-slate-200 rounded-tl-none border border-slate-200 dark:border-slate-700/60'
                      }`}
                    >
                      <div className="whitespace-pre-wrap">{msg.text}</div>

                      {/* Remediation Suggestions Checklist */}
                      {msg.suggestions && msg.suggestions.length > 0 && (
                        <div className="mt-3 pt-2 border-t border-slate-200 dark:border-slate-700 space-y-1.5">
                          <div className="text-[10px] font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider">
                            Recommended Action Checklist:
                          </div>
                          {msg.suggestions.map((s, idx) => (
                            <div key={idx} className="p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 text-emerald-800 dark:text-emerald-300 text-[11px] flex items-start gap-1.5">
                              <span className="font-bold">✓</span>
                              <span>{s}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <span className="text-[9px] text-slate-400 mt-1 px-1 font-mono">{msg.time}</span>
                  </div>
                ))}

                {chatLoading && (
                  <div className="flex items-center gap-2 p-3 rounded-2xl bg-slate-100 dark:bg-slate-800/80 text-slate-500 text-xs w-fit rounded-tl-none animate-pulse">
                    <div className="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></div>
                    <span>Consulting statutory guidelines & document context...</span>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* Chat Input Footer */}
              <form
                onSubmit={(e) => { e.preventDefault(); handleSendChatMessage(); }}
                className="p-3 bg-slate-50 dark:bg-slate-950/80 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2"
              >
                <input
                  type="text"
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  placeholder="Ask about statutory rules, status, or remediation..."
                  className="flex-1 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs text-slate-900 dark:text-white outline-none focus:border-indigo-500 shadow-sm"
                />
                <button
                  type="submit"
                  disabled={chatLoading || !chatInput.trim()}
                  className="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white transition shadow active:scale-95 cursor-pointer"
                >
                  <Icon name="send" className="w-4 h-4" />
                </button>
              </form>

            </div>
          )}

          {/* Portal Footer */}
          <footer className="border-t border-slate-200 dark:border-slate-800 px-6 py-4 bg-white/80 dark:bg-slate-950/80 text-xs text-slate-600 dark:text-slate-400 flex flex-wrap items-center justify-between gap-4 transition-colors duration-300">
            <div className="flex items-center gap-3">
              <span className="font-bold text-amber-600 dark:text-amber-400">🇮🇳 Digital India Initiative</span>
              <span>•</span>
              <span>Zero-Trust Architecture</span>
              <span>•</span>
              <span>All Rights Reserved</span>
            </div>
            <div className="font-mono text-[11px] text-slate-500">
              SIH26188 • Deep Biometric & Tampering Inspection System
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
