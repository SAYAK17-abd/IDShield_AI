    // Helper: Dynamic Lucide Icon Wrapper
    function Icon({ name, className = "w-4 h-4" }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current && window.lucide) {
          const iconEl = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons['help-circle'] || window.lucide.icons['circle']);
          containerRef.current.innerHTML = '';
          if (iconEl) {
            iconEl.setAttribute('class', className);
            containerRef.current.appendChild(iconEl);
          }
        }
      }, [name, className]);
      return <span ref={containerRef} className="inline-flex items-center justify-center flex-shrink-0" />;
    }
