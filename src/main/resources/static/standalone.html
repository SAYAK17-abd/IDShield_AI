    function App() {
      // Theme Management (Light, Dark, System Auto-detect)
      const [themeMode, setThemeMode] = useState(() => {
        const saved = localStorage.getItem('idshield_theme_mode');
        return (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
      });

      useEffect(() => {
        const apply = () => {
          const isDark = themeMode === 'dark' || (themeMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        };
        apply();
        localStorage.setItem('idshield_theme_mode', themeMode);

        if (window.matchMedia) {
          const listener = () => {
            if (themeMode === 'system') apply();
          };
          const mql = window.matchMedia('(prefers-color-scheme: dark)');
          mql.addEventListener('change', listener);
          return () => mql.removeEventListener('change', listener);
        }
      }, [themeMode]);

      // Auth State
      const [currentUser, setCurrentUser] = useState(DEMO_USERS[0]);
      const [authToken, setAuthToken] = useState(null);
      const [gatewayStatus, setGatewayStatus] = useState('connecting');
      const [showUserMenu, setShowUserMenu] = useState(false);
      const [showAuditModal, setShowAuditModal] = useState(false);

      // Document State
      const [selectedDocType, setSelectedDocType] = useState(PRIMARY_DOCUMENTS[0].id);
      const [showMoreDocs, setShowMoreDocs] = useState(false);
      const [docFile, setDocFile] = useState(null);
      const [docPreviewUrl, setDocPreviewUrl] = useState(null);
      const [selfieFile, setSelfieFile] = useState(null);
      const [selfiePreviewUrl, setSelfiePreviewUrl] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      // Screening State
      const [isScreening, setIsScreening] = useState(false);
      const [screeningStep, setScreeningStep] = useState('');
      const [verificationResult, setVerificationResult] = useState(null);
      const [uploadedDocMeta, setUploadedDocMeta] = useState(null);
      const [errorNotice, setErrorNotice] = useState(null);

      // Audit Logs State (For Admin)
      const [auditLogs, setAuditLogs] = useState([]);
      const [loadingLogs, setLoadingLogs] = useState(false);

      // References for file inputs
      const docInputRef = useRef(null);
      const selfieInputRef = useRef(null);
      const cameraDocRef = useRef(null);

      const selectedDocObj = ALL_DOCUMENTS.find(d => d.id === selectedDocType) || PRIMARY_DOCUMENTS[0];

      // Login on startup with default Admin user
      useEffect(() => {
        performLogin(currentUser);
      }, []);

      // Clean preview URLs
      useEffect(() => {
        return () => {
          if (docPreviewUrl) URL.revokeObjectURL(docPreviewUrl);
          if (selfiePreviewUrl) URL.revokeObjectURL(selfiePreviewUrl);
        };
      }, [docPreviewUrl, selfiePreviewUrl]);

      const performLogin = async (userObj) => {
        setGatewayStatus('connecting');
        setErrorNotice(null);
        try {
          const res = await fetch(`${GATEWAY_BASE_URL}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userObj.email, password: userObj.pass })
          });

          if (res.ok) {
            const json = await res.json();
            const token = json.data?.accessToken;
            setAuthToken(token);
            setCurrentUser(userObj);
            setGatewayStatus('connected');
          } else {
            setGatewayStatus('disconnected');
            setErrorNotice(`Authentication failed for ${userObj.email} (HTTP ${res.status})`);
          }
        } catch (err) {
          setGatewayStatus('disconnected');
          setErrorNotice(`Cannot connect to Spring Boot Gateway at ${GATEWAY_BASE_URL}. Ensure server is running.`);
        }
      };

      const handleUserSwitch = (targetUser) => {
        setShowUserMenu(false);
        performLogin(targetUser);
      };

      // File Handlers
      const handleDocSelect = (file) => {
        if (!file) return;
        setDocFile(file);
        if (file.type && file.type.startsWith('image/')) {
          setDocPreviewUrl(URL.createObjectURL(file));
        } else {
          setDocPreviewUrl(null);
        }
      };

      const handleSelfieSelect = (file) => {
        if (!file) return;
        setSelfieFile(file);
        if (file.type && file.type.startsWith('image/')) {
          setSelfiePreviewUrl(URL.createObjectURL(file));
        }
      };

      // Main Screening Pipeline Execution
      const executeScreening = async () => {
        if (!docFile) {
          setErrorNotice('Please select or capture an Indian identity document first.');
          return;
        }
        if (!authToken) {
          setErrorNotice('Not authenticated with Spring Boot Gateway. Please wait for reconnection.');
          return;
        }

        setIsScreening(true);
        setErrorNotice(null);
        setVerificationResult(null);

        try {
          // STEP 1: Upload to /api/documents/upload
          setScreeningStep('1/3: Ingesting & Verifying Magic Bytes...');
          const formData = new FormData();
          formData.append('file', docFile);
          formData.append('documentType', selectedDocType);
          if (selfieFile) {
            formData.append('selfie', selfieFile);
          }

          const uploadRes = await fetch(`${GATEWAY_BASE_URL}/api/documents/upload`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${authToken}`
            },
            body: formData
          });

          if (!uploadRes.ok) {
            const errData = await uploadRes.json().catch(() => ({}));
            throw new Error(errData.message || `Document upload rejected with HTTP ${uploadRes.status}`);
          }

          const uploadData = await uploadRes.json();
          const docId = uploadData.data?.id;
          setUploadedDocMeta(uploadData.data);

          // STEP 2: Trigger AI Verification
          setScreeningStep('2/3: Running AI Biometrics & Tamper Neural Inspection...');
          const verifyRes = await fetch(`${GATEWAY_BASE_URL}/api/verifications/documents/${docId}`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${authToken}`
            }
          });

          if (!verifyRes.ok) {
            const errData = await verifyRes.json().catch(() => ({}));
            throw new Error(errData.message || `AI Verification failed with HTTP ${verifyRes.status}`);

                            <button
                              type="button"
                              onClick={() => handleOfficerDecision('REVIEW_REQUIRED', 'Marked for forensic lab physical verification.')}
                              className="py-2.5 px-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow cursor-pointer"
                            >
                              <Icon name="clock" className="w-3.5 h-3.5" />
                              Flag for Review
                            </button>
                            <button
                              type="button"
                              onClick={() => handleOfficerDecision('REJECTED', 'Tampering confirmed. Identity document rejected.')}
                              className="py-2.5 px-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow cursor-pointer"
                            >
                              <Icon name="x" className="w-3.5 h-3.5" />
                              Reject as Fake
                            </button>
                          </div>
                        </div>
                      )}
                    </>
                  )}

                </div>
              )}

            </div>

          </main>

          {/* AUDIT LOG MODAL (FOR ADMIN) */}
          {showAuditModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/80 rounded-3xl max-w-4xl w-full p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                      <Icon name="shield" className="w-5 h-5 text-purple-600 dark:text-purple-400" />
                      Append-Only System Audit Trail
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">Forensically logged events stored in PostgreSQL</p>
                  </div>
                  <button
                    onClick={() => setShowAuditModal(false)}
                    className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                  {loadingLogs ? (
                    <div className="py-12 text-center text-xs text-slate-400">Loading audit records...</div>
                  ) : auditLogs.length === 0 ? (
                    <div className="py-12 text-center text-xs text-slate-400">No audit events recorded yet.</div>
                  ) : (
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 text-[10px] uppercase font-mono">
                          <th className="py-2">Timestamp</th>
                          <th className="py-2">Event</th>
                          <th className="py-2">Actor</th>
                          <th className="py-2">Entity ID</th>
                          <th className="py-2">Details</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 dark:divide-slate-800/60 font-mono text-[11px]">
                        {auditLogs.map((log) => (
                          <tr key={log.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                            <td className="py-2 text-slate-500 dark:text-slate-400 whitespace-nowrap">
                              {new Date(log.timestamp).toLocaleTimeString()}
                            </td>
                            <td className="py-2">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-900/60">
                                {log.eventType}
                              </span>
                            </td>
                            <td className="py-2 text-slate-700 dark:text-slate-300 truncate max-w-[140px]">{log.userEmail}</td>
                            <td className="py-2 text-indigo-600 dark:text-indigo-400">#{log.entityId}</td>
                            <td className="py-2 text-slate-500 dark:text-slate-400 truncate max-w-[200px]">{log.details}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* PORTAL FOOTER */}
          <footer className="border-t border-slate-200 dark:border-slate-800 px-6 py-4 bg-white/80 dark:bg-slate-950/80 text-xs text-slate-600 dark:text-slate-400 flex flex-wrap items-center justify-between gap-4 transition-colors duration-300">
            <div className="flex items-center gap-3">
              <span className="font-bold text-amber-600 dark:text-amber-400">🇮🇳 Digital India Initiative</span>
              <span>•</span>
              <span>Zero-Trust Architecture</span>
              <span>•</span>
              <span>All Rights Reserved</span>
            </div>
            <div className="font-mono text-[11px] text-slate-500">
              SIH26188 • Deep Biometric & Tampering Inspection System
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
