<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IDShield AI — Identity Document Verification & Fraud Screening</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            dark: {
              950: '#070a13',
              900: '#0b0f19',
              850: '#111827',
              800: '#161f32',
              750: '#1c2842',
              700: '#1e293b',
              600: '#334155',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070a13;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Gateway Endpoint:
    // Defaults to http://127.0.0.1:8080 when running as file://, localhost, or 127.0.0.1
    const GATEWAY_BASE_URL = (!window.location.hostname || window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://127.0.0.1:8080' 
      : `${window.location.protocol}//${window.location.hostname}:8080`;

    // Indian Documents Catalog
    const INDIAN_DOCUMENTS = [
      {
        id: 'AADHAAR_CARD',
        name: 'Aadhaar Card',
        dept: 'UIDAI',
        format: '12-Digit UID (XXXX XXXX XXXX)',
        icon: 'fingerprint',
        color: 'from-amber-500/20 to-orange-500/20 border-orange-500/40 text-orange-400',
        badge: 'UIDAI Verified',
        popular: true
      },
      {
        id: 'PAN_CARD',
        name: 'Permanent Account Number (PAN)',
        dept: 'Income Tax Dept',
        format: '10-Digit Alphanumeric (ABCDE1234F)',
        icon: 'credit-card',
        color: 'from-blue-500/20 to-cyan-500/20 border-blue-500/40 text-blue-400',
        badge: 'Tax Dept',
        popular: true
      },
      {
        id: 'VOTER_ID',
        name: 'Voter ID Card (EPIC)',
        dept: 'Election Commission of India',
        format: 'EPIC No. (WBF2938172)',
        icon: 'vote',
        color: 'from-emerald-500/20 to-teal-500/20 border-emerald-500/40 text-emerald-400',
        badge: 'ECI',
        popular: true
      },
      {
        id: 'DRIVING_LICENSE',
        name: 'Driving Licence (DL)',
        dept: 'MoRTH / Sarathi',
        format: 'State Code + Year (WB-0420180029381)',
        icon: 'car',
        color: 'from-purple-500/20 to-indigo-500/20 border-purple-500/40 text-purple-400',
        badge: 'Sarathi',
        popular: true
      },
      {
        id: 'INDIAN_PASSPORT',
        name: 'Indian Passport (Republic of India)',
        dept: 'Ministry of External Affairs',
        format: 'Letter + 7 Digits (P8291048)',
        icon: 'globe',
        color: 'from-sky-500/20 to-blue-500/20 border-sky-500/40 text-sky-400',
        badge: 'MEA MRZ',
        popular: false
      },
      {
        id: 'STUDENT_ID',
        name: 'Academic / College Student ID',
        dept: 'Recognized University / Institute',
        format: 'Roll / Enrollment (BWU/BTECH/2022/041)',
        icon: 'graduation-cap',
        color: 'from-pink-500/20 to-rose-500/20 border-pink-500/40 text-pink-400',
        badge: 'Institute',
        popular: true
      },
      {
        id: 'VEHICLE_RC',
        name: 'Vehicle Registration Certificate (RC)',
        dept: 'MoRTH / Vahan',
        format: 'Reg No (WB-02-AB-1234)',
        icon: 'truck',
        color: 'from-yellow-500/20 to-amber-500/20 border-yellow-500/40 text-yellow-400',
        badge: 'Vahan',
        popular: false
      },
      {
        id: 'RATION_CARD',
        name: 'Ration Card / NFSA Smart Card',
        dept: 'Food & Supplies Dept',
        format: 'NFSA Family ID (RC-192837461)',
        icon: 'shopping-bag',
        color: 'from-green-500/20 to-emerald-500/20 border-green-500/40 text-green-400',
        badge: 'NFSA',
        popular: false
      }
    ];

    // Pre-seeded Demo Users with Roles
    const DEMO_USERS = [
      {
        role: 'ROLE_ADMIN',
        name: 'System Administrator',
        email: 'admin@idshield.com',
        pass: 'Admin@123456!',
        title: 'Admin',
        desc: 'Full System Oversight & Audit Trail',
        avatarBg: 'bg-purple-600',
        badgeColor: 'bg-purple-500/10 text-purple-400 border-purple-500/30',
        icon: 'shield-alert'
      },
      {
        role: 'ROLE_INVESTIGATOR',
        name: 'Officer Rajesh Sen',
        email: 'investigator@idshield.com',
        pass: 'Investigator@123456!',
        title: 'Officer / Investigator',
        desc: 'Case Review & Status Decider',
        avatarBg: 'bg-blue-600',
        badgeColor: 'bg-blue-500/10 text-blue-400 border-blue-500/30',
        icon: 'search'
      },
      {
        role: 'ROLE_USER',
        name: 'Citizen Sayak Dutta',
        email: 'user@idshield.com',
        pass: 'User@123456!',
        title: 'Citizen User',
        desc: 'Document Upload & Personal Screening',
        avatarBg: 'bg-emerald-600',
        badgeColor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
        icon: 'user'
      }
    ];

    function App() {
      // Auth State
      const [currentUser, setCurrentUser] = useState(DEMO_USERS[0]);
      const [authToken, setAuthToken] = useState(null);
      const [gatewayStatus, setGatewayStatus] = useState('connecting'); // 'connected' | 'disconnected' | 'connecting'
      const [showUserMenu, setShowUserMenu] = useState(false);
      const [showAuditModal, setShowAuditModal] = useState(false);

      // Document State
      const [selectedDocType, setSelectedDocType] = useState(INDIAN_DOCUMENTS[0].id);
      const [docFile, setDocFile] = useState(null);
      const [docPreviewUrl, setDocPreviewUrl] = useState(null);
      const [selfieFile, setSelfieFile] = useState(null);
      const [selfiePreviewUrl, setSelfiePreviewUrl] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      // Screening State
      const [isScreening, setIsScreening] = useState(false);
      const [screeningStep, setScreeningStep] = useState('');
      const [verificationResult, setVerificationResult] = useState(null);
      const [uploadedDocMeta, setUploadedDocMeta] = useState(null);
      const [errorNotice, setErrorNotice] = useState(null);

      // Audit Logs State (For Admin)
      const [auditLogs, setAuditLogs] = useState([]);
      const [loadingLogs, setLoadingLogs] = useState(false);

      // References for file inputs
      const docInputRef = useRef(null);
      const selfieInputRef = useRef(null);
      const cameraDocRef = useRef(null);

      // Trigger Lucide icon replacement on DOM update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Login on startup with default Admin user
      useEffect(() => {
        performLogin(currentUser);
      }, []);

      // Clean preview URLs
      useEffect(() => {
        return () => {
          if (docPreviewUrl) URL.revokeObjectURL(docPreviewUrl);
          if (selfiePreviewUrl) URL.revokeObjectURL(selfiePreviewUrl);
        };
      }, [docPreviewUrl, selfiePreviewUrl]);

      const performLogin = async (userObj) => {
        setGatewayStatus('connecting');
        setErrorNotice(null);
        try {
          const res = await fetch(`${GATEWAY_BASE_URL}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userObj.email, password: userObj.pass })
          });

          if (res.ok) {
            const json = await res.json();
            const token = json.data?.accessToken;
            setAuthToken(token);
            setCurrentUser(userObj);
            setGatewayStatus('connected');
          } else {
            setGatewayStatus('disconnected');
            setErrorNotice(`Authentication failed for ${userObj.email} (HTTP ${res.status})`);
          }
        } catch (err) {
          setGatewayStatus('disconnected');
          setErrorNotice(`Cannot connect to Spring Boot Gateway at ${GATEWAY_BASE_URL}. Ensure server is running.`);
        }
      };

      const handleUserSwitch = (targetUser) => {
        setShowUserMenu(false);
        performLogin(targetUser);
      };

      // File Handlers
      const handleDocSelect = (file) => {
        if (!file) return;
        setDocFile(file);
        if (file.type.startsWith('image/')) {
          setDocPreviewUrl(URL.createObjectURL(file));
        } else {
          setDocPreviewUrl(null);
        }
      };

      const handleSelfieSelect = (file) => {
        if (!file) return;
        setSelfieFile(file);
        if (file.type.startsWith('image/')) {
          setSelfiePreviewUrl(URL.createObjectURL(file));
        }
      };

      // Main Screening Pipeline Execution
      const executeScreening = async () => {
        if (!docFile) {
          setErrorNotice('Please select or capture an Indian identity document first.');
          return;
        }
        if (!authToken) {
          setErrorNotice('Not authenticated with Spring Boot Gateway. Please wait for reconnection.');
          return;
        }

        setIsScreening(true);
        setErrorNotice(null);
        setVerificationResult(null);

        try {
          // STEP 1: Upload to /api/documents/upload
          setScreeningStep('1/3: Ingesting & Verifying Magic Bytes...');
          const formData = new FormData();
          formData.append('file', docFile);
          formData.append('documentType', selectedDocType);

          const uploadRes = await fetch(`${GATEWAY_BASE_URL}/api/documents/upload`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${authToken}`
            },
            body: formData
          });

          if (!uploadRes.ok) {
            const errData = await uploadRes.json().catch(() => ({}));
            throw new Error(errData.message || `Document upload rejected with HTTP ${uploadRes.status}`);
          }

          const uploadData = await uploadRes.json();
          const docId = uploadData.data?.id;
          setUploadedDocMeta(uploadData.data);

          // STEP 2: Trigger AI Verification
          setScreeningStep('2/3: Running AI Biometrics & Tamper Neural Inspection...');
          const verifyRes = await fetch(`${GATEWAY_BASE_URL}/api/verifications/documents/${docId}`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${authToken}`
            }
          });

          if (!verifyRes.ok) {
            const errData = await verifyRes.json().catch(() => ({}));
            throw new Error(errData.message || `Verification screening failed with HTTP ${verifyRes.status}`);
          }

          const verifyData = await verifyRes.json();

          // STEP 3: Complete & Render
          setScreeningStep('3/3: Synthesizing Transparent Risk Scores...');
          await new Promise(r => setTimeout(r, 600)); // Smooth UI transition
          setVerificationResult(verifyData.data);

        } catch (err) {
          console.error(err);
          setErrorNotice(err.message || 'An unexpected error occurred during screening.');
        } finally {
          setIsScreening(false);
          setScreeningStep('');
        }
      };

      // Officer Decision Action
      const handleOfficerDecision = async (newStatus, notes) => {
        if (!verificationResult?.id) return;
        try {
          const res = await fetch(`${GATEWAY_BASE_URL}/api/verifications/${verificationResult.id}/status`, {
            method: 'PATCH',
            headers: {
              'Authorization': `Bearer ${authToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              status: newStatus,
              investigatorNotes: notes || `Case updated to ${newStatus} by ${currentUser.name}`
            })
          });

          if (res.ok) {
            const data = await res.json();
            setVerificationResult(prev => ({
              ...prev,
              investigationStatus: newStatus,
              reviewedByUserEmail: currentUser.email,
              investigatorNotes: notes || `Decision confirmed by ${currentUser.name}`
            }));
          } else {
            alert(`Failed to update case status (HTTP ${res.status})`);
          }
        } catch (err) {
          alert(`Network error updating status: ${err.message}`);
        }
      };

      // Fetch Audit Logs (Admin only)
      const fetchAuditLogs = async () => {
        setShowAuditModal(true);
        setLoadingLogs(true);
        try {
          const res = await fetch(`${GATEWAY_BASE_URL}/api/audit-logs?size=15`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          if (res.ok) {
            const data = await res.json();
            setAuditLogs(data.data?.content || []);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoadingLogs(false);
        }
      };

      const selectedDocObj = INDIAN_DOCUMENTS.find(d => d.id === selectedDocType) || INDIAN_DOCUMENTS[0];

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          
          {/* TOP NAVBAR & USER SWITCHER */}
          <header className="sticky top-0 z-40 glass-nav px-4 sm:px-8 py-3.5 flex items-center justify-between border-b border-slate-800/80">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-bold text-xl">
                🛡️
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="font-bold text-lg tracking-tight text-white flex items-center gap-1.5">
                    IDShield AI
                    <span className="hidden sm:inline-block text-[10px] uppercase font-semibold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full">
                      SIH26188 Gateway
                    </span>
                  </h1>
                </div>
                <div className="flex items-center space-x-2 text-xs">
                  <span className={`inline-block w-2 h-2 rounded-full ${
                    gatewayStatus === 'connected' ? 'bg-emerald-400 animate-pulse' :
                    gatewayStatus === 'connecting' ? 'bg-amber-400 animate-ping' : 'bg-rose-500'
                  }`}></span>
                  <span className="text-slate-400 hidden sm:inline">Port 8080:</span>
                  <span className={gatewayStatus === 'connected' ? 'text-emerald-400 font-medium' : 'text-slate-400'}>
                    {gatewayStatus === 'connected' ? 'Gateway Online' : gatewayStatus === 'connecting' ? 'Connecting...' : 'Gateway Offline'}
                  </span>
                </div>
              </div>
            </div>

            {/* USER SWITCHER CONTROL */}
            <div className="relative">
              <button
                onClick={() => setShowUserMenu(!showUserMenu)}
                className="flex items-center space-x-2.5 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 rounded-full py-1.5 pl-2 pr-3.5 text-xs transition shadow-sm active:scale-95"
              >
                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-white font-semibold text-xs shadow ${currentUser.avatarBg}`}>
                  {currentUser.title.charAt(0)}
                </div>
                <div className="text-left hidden md:block">
                  <div className="font-semibold text-slate-200 leading-tight flex items-center gap-1">
                    {currentUser.name}
                    <span className={`text-[9px] px-1.5 py-0.2 rounded border font-mono ${currentUser.badgeColor}`}>
                      {currentUser.title}
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400">{currentUser.email}</div>
                </div>
                <i data-lucide="chevron-down" className="w-3.5 h-3.5 text-slate-400"></i>
              </button>

              {/* User Dropdown Menu */}
              {showUserMenu && (
                <div className="absolute right-0 mt-2 w-80 rounded-2xl glass-card bg-slate-900/95 border border-slate-700/80 shadow-2xl p-2 z-50 animate-in fade-in zoom-in-95">
                  <div className="px-3 py-2 border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                    Switch Security Role
                  </div>
                  <div className="space-y-1 mt-1">
                    {DEMO_USERS.map(user => {
                      const isSelected = currentUser.email === user.email;
                      return (
                        <button
                          key={user.email}
                          onClick={() => handleUserSwitch(user)}
                          className={`w-full text-left p-2.5 rounded-xl flex items-start space-x-3 transition ${
                            isSelected ? 'bg-indigo-600/20 border border-indigo-500/40 text-white' : 'hover:bg-slate-800/80 text-slate-300'
                          }`}
                        >
                          <div className={`w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center text-white font-bold text-xs ${user.avatarBg}`}>
                            {user.title.charAt(0)}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center justify-between">
                              <span className="font-semibold text-xs truncate">{user.title}</span>
                              {isSelected && (
                                <span className="text-[10px] text-indigo-400 font-mono">● Active</span>
                              )}
                            </div>
                            <div className="text-[11px] text-slate-400 truncate">{user.name} ({user.email})</div>
                            <div className="text-[10px] text-slate-500 mt-0.5">{user.desc}</div>
                          </div>
                        </button>
                      );
                    })}
                  </div>

                  {currentUser.role === 'ROLE_ADMIN' && (
                    <div className="mt-2 pt-2 border-t border-slate-800">
                      <button
                        onClick={() => { setShowUserMenu(false); fetchAuditLogs(); }}
                        className="w-full text-left px-3 py-2 rounded-lg text-xs text-purple-300 hover:bg-purple-950/40 flex items-center justify-between font-medium"
                      >
                        <span className="flex items-center gap-1.5">
                          <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                          View Forensic Audit Logs
                        </span>
                        <i data-lucide="external-link" className="w-3 h-3 text-purple-400"></i>
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </header>

          {/* MAIN APPLICATION CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            
            {/* ROLE BANNER NOTIFICATION */}
            <div className={`p-3.5 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-2 shadow-sm ${
              currentUser.role === 'ROLE_ADMIN' ? 'bg-purple-950/20 border-purple-800/40 text-purple-300' :
              currentUser.role === 'ROLE_INVESTIGATOR' ? 'bg-blue-950/20 border-blue-800/40 text-blue-300' :
              'bg-emerald-950/20 border-emerald-800/40 text-emerald-300'
            }`}>
              <div className="flex items-center space-x-2.5">
                <div className={`p-2 rounded-xl text-white ${currentUser.avatarBg}`}>
                  <i data-lucide={currentUser.icon} className="w-4 h-4"></i>
                </div>
                <div>
                  <div className="font-semibold text-xs text-white">
                    Signed in as {currentUser.title} ({currentUser.email})
                  </div>
                  <div className="text-[11px] opacity-80">{currentUser.desc}</div>
                </div>
              </div>

              {currentUser.role === 'ROLE_ADMIN' && (
                <button
                  onClick={fetchAuditLogs}
                  className="text-xs bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/40 text-purple-200 px-3 py-1.5 rounded-lg transition font-medium self-start sm:self-auto"
                >
                  Inspect Audit Trail (Immutable)
                </button>
              )}
            </div>

            {/* ERROR NOTIFICATION */}
            {errorNotice && (
              <div className="p-4 rounded-2xl bg-rose-950/40 border border-rose-800/60 text-rose-300 text-xs flex items-start space-x-3">
                <i data-lucide="alert-triangle" className="w-4 h-4 text-rose-400 flex-shrink-0 mt-0.5"></i>
                <div className="flex-1 font-medium">{errorNotice}</div>
                <button onClick={() => setErrorNotice(null)} className="text-rose-400 hover:text-rose-200">
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
              </div>
            )}

            {/* DUAL-COLUMN WORKSPACE: LEFT (UPLOAD) | RIGHT (RESULTS) */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              
              {/* LEFT COLUMN: DOCUMENT & SELFIE SELECTION */}
              <div className="lg:col-span-5 space-y-6">
                <div className="glass-card rounded-3xl p-5 sm:p-6 border border-slate-800 shadow-xl space-y-5">
                  <div>
                    <h2 className="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="file-plus" className="w-5 h-5 text-indigo-400"></i>
                      Document & Identity Ingestion
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">
                      Select document type, upload ID, and run multi-layer forensic screening.
                    </p>
                  </div>

                  {/* INDIAN DOCUMENT TYPE SELECTOR (CAROUSEL / GRID) */}
                  <div className="space-y-2">
                    <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                      <span>Indian Document Format</span>
                      <span className="text-[10px] text-indigo-400 font-mono">8 Types Supported</span>
                    </label>

                    <div className="grid grid-cols-2 gap-2 max-h-56 overflow-y-auto pr-1 custom-scrollbar">
                      {INDIAN_DOCUMENTS.map(doc => {
                        const isSelected = selectedDocType === doc.id;
                        return (
                          <button
                            key={doc.id}
                            type="button"
                            onClick={() => setSelectedDocType(doc.id)}
                            className={`p-2.5 rounded-2xl border text-left transition relative flex flex-col justify-between ${
                              isSelected
                                ? 'bg-gradient-to-br from-indigo-950/70 to-slate-900 border-indigo-500 shadow-lg shadow-indigo-500/10'
                                : 'bg-slate-900/60 hover:bg-slate-800/70 border-slate-800 text-slate-400'
                            }`}
                          >
                            <div className="flex items-center justify-between w-full mb-1">
                              <span className={`text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded border ${doc.color}`}>
                                {doc.badge}
                              </span>
                              {isSelected && (
                                <i data-lucide="check-circle" className="w-3.5 h-3.5 text-indigo-400"></i>
                              )}
                            </div>
                            <div className={`text-xs font-semibold leading-tight line-clamp-1 ${isSelected ? 'text-white' : 'text-slate-300'}`}>
                              {doc.name}
                            </div>
                            <div className="text-[10px] text-slate-500 truncate mt-0.5 font-mono">
                              {doc.format}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* DOCUMENT FILE UPLOADER */}
                  <div className="space-y-2">
                    <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                      <span>{selectedDocObj.name} File</span>
                      <span className="text-[10px] text-slate-400 font-mono">PDF, JPEG, PNG (Max 10MB)</span>
                    </label>

                    <input
                      type="file"
                      ref={docInputRef}
                      className="hidden"
                      accept="image/jpeg,image/png,application/pdf"
                      onChange={(e) => handleDocSelect(e.target.files[0])}
                    />

                    {/* Camera Capture for mobile */}
                    <input
                      type="file"
                      ref={cameraDocRef}
                      className="hidden"
                      accept="image/*"
                      capture="environment"
                      onChange={(e) => handleDocSelect(e.target.files[0])}
                    />

                    <div
                      onClick={() => docInputRef.current?.click()}
                      onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                      onDragLeave={() => setIsDragging(false)}
                      onDrop={(e) => {
                        e.preventDefault();
                        setIsDragging(false);
                        handleDocSelect(e.dataTransfer.files[0]);
                      }}
                      className={`border-2 border-dashed rounded-2xl p-4 sm:p-5 text-center cursor-pointer transition flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden ${
                        isDragging ? 'border-indigo-500 bg-indigo-950/20' :
                        docFile ? 'border-indigo-500/60 bg-slate-900/80' : 'border-slate-800 hover:border-slate-700 bg-slate-900/40'
                      }`}
                    >
                      {docPreviewUrl ? (
                        <div className="w-full flex flex-col items-center">
                          <img
                            src={docPreviewUrl}
                            alt="Document Preview"
                            className="max-h-32 object-contain rounded-lg shadow-md border border-slate-700"
                          />
                          <span className="text-[11px] text-slate-300 font-medium mt-2 truncate max-w-[240px]">
                            {docFile.name} ({(docFile.size / 1024).toFixed(1)} KB)
                          </span>
                          <span className="text-[10px] text-indigo-400">Click to replace file</span>
                        </div>
                      ) : docFile ? (
                        <div className="text-center">
                          <div className="w-12 h-12 rounded-xl bg-indigo-950 border border-indigo-800 flex items-center justify-center mx-auto text-indigo-400 mb-2">
                            <i data-lucide="file-text" className="w-6 h-6"></i>
                          </div>
                          <div className="text-xs font-semibold text-white">{docFile.name}</div>
                          <div className="text-[10px] text-slate-400">{(docFile.size / 1024).toFixed(1)} KB</div>
                        </div>
                      ) : (
                        <div className="space-y-2">
                          <div className="w-10 h-10 rounded-full bg-slate-800/80 flex items-center justify-center mx-auto text-indigo-400">
                            <i data-lucide="upload-cloud" className="w-5 h-5"></i>
                          </div>
                          <div className="text-xs text-slate-300 font-medium">
                            Drag & drop {selectedDocObj.name} here, or <span className="text-indigo-400 underline">browse</span>
                          </div>
                          <div className="text-[10px] text-slate-500">
                            Protected by magic-byte checking & anti-tamper SHA-256
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Quick mobile camera button */}
                    <div className="flex items-center gap-2 pt-1">
                      <button
                        type="button"
                        onClick={(e) => { e.stopPropagation(); cameraDocRef.current?.click(); }}
                        className="flex-1 py-1.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 flex items-center justify-center gap-1.5 font-medium transition"
                      >
                        <i data-lucide="camera" className="w-3.5 h-3.5 text-indigo-400"></i>
                        Use Smartphone Camera
                      </button>
                    </div>
                  </div>

                  {/* OPTIONAL SELFIE BIOMETRICS */}
                  <div className="space-y-2 pt-1 border-t border-slate-800/80">
                    <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                      <span>Face Selfie Match (Optional)</span>
                      <span className="text-[10px] text-emerald-400 font-mono">Biometric 1:1</span>
                    </label>

                    <input
                      type="file"
                      ref={selfieInputRef}
                      className="hidden"
                      accept="image/*"
                      capture="user"
                      onChange={(e) => handleSelfieSelect(e.target.files[0])}
                    />

                    <div
                      onClick={() => selfieInputRef.current?.click()}
                      className="border border-slate-800 hover:border-slate-700 bg-slate-900/30 rounded-2xl p-3 text-center cursor-pointer flex items-center justify-between gap-3 transition"
                    >
                      <div className="flex items-center space-x-3">
                        {selfiePreviewUrl ? (
                          <img src={selfiePreviewUrl} className="w-10 h-10 rounded-full object-cover border border-indigo-500" />
                        ) : (
                          <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
                            <i data-lucide="user-check" className="w-5 h-5"></i>
                          </div>
                        )}
                        <div className="text-left">
                          <div className="text-xs font-medium text-slate-300">
                            {selfieFile ? selfieFile.name : 'Take or upload selfie'}
                          </div>
                          <div className="text-[10px] text-slate-500">
                            Matches face on {selectedDocObj.name} with live capture
                          </div>
                        </div>
                      </div>
                      <span className="text-[11px] text-indigo-400 font-medium px-2 py-1 rounded bg-indigo-950/40 border border-indigo-900/60">
                        {selfieFile ? 'Change' : 'Capture'}
                      </span>
                    </div>
                  </div>

                  {/* RUN SCREENING ACTION BUTTON */}
                  <div className="pt-2">
                    <button
                      type="button"
                      disabled={isScreening || !docFile}
                      onClick={executeScreening}
                      className={`w-full py-3.5 px-4 rounded-2xl font-bold text-sm text-white shadow-xl flex items-center justify-center space-x-2 transition active:scale-[0.98] ${
                        isScreening ? 'bg-indigo-700 cursor-wait' :
                        !docFile ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700/50' :
                        'bg-gradient-to-r from-indigo-600 via-indigo-500 to-blue-600 hover:from-indigo-500 hover:to-blue-500 shadow-indigo-600/30'
                      }`}
                    >
                      {isScreening ? (
                        <>
                          <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                          <span>{screeningStep || 'Screening Document...'}</span>
                        </>
                      ) : (
                        <>
                          <i data-lucide="shield-check" className="w-4 h-4"></i>
                          <span>Run Multi-Signal Security Screening</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </div>

              {/* RIGHT COLUMN: SCREENING REPORT & FORENSIC METRICS */}
              <div className="lg:col-span-7 space-y-6">
                <div className="glass-card rounded-3xl p-5 sm:p-6 border border-slate-800 shadow-xl min-h-[520px] flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-5">
                      <div>
                        <h2 className="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                          <i data-lucide="cpu" className="w-5 h-5 text-indigo-400"></i>
                          Verification & Risk Assessment Report
                        </h2>
                        <p className="text-xs text-slate-400 mt-0.5">
                          Autonomous AI fraud scoring with explainable forensic signals.
                        </p>
                      </div>

                      {verificationResult && (
                        <span className="text-[11px] font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">
                          Case #VER-{verificationResult.id}
                        </span>
                      )}
                    </div>

                    {/* EMPTY STATE */}
                    {!verificationResult && !isScreening && (
                      <div className="py-20 text-center flex flex-col items-center justify-center space-y-3">
                        <div className="w-16 h-16 rounded-3xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500 shadow-inner">
                          <i data-lucide="scan-face" className="w-8 h-8"></i>
                        </div>
                        <div className="text-sm font-semibold text-slate-300">Ready for Document Screening</div>
                        <div className="text-xs text-slate-500 max-w-sm">
                          Select an Indian identity document on the left and click "Run Security Screening" to generate forensic scores.
                        </div>
                      </div>
                    )}

                    {/* LOADING STATE */}
                    {isScreening && (
                      <div className="py-20 text-center flex flex-col items-center justify-center space-y-4 animate-pulse">
                        <div className="w-16 h-16 rounded-3xl bg-indigo-950/60 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                          <i data-lucide="refresh-cw" className="w-8 h-8 animate-spin"></i>
                        </div>
                        <div className="text-sm font-bold text-white">{screeningStep}</div>
                        <div className="w-64 h-2 bg-slate-800 rounded-full overflow-hidden">
                          <div className="h-full bg-gradient-to-r from-indigo-500 to-blue-500 rounded-full w-2/3 animate-pulse"></div>
                        </div>
                        <div className="text-xs text-slate-500 font-mono">
                          Inspecting magic bytes, font glyphs & biometric vectors
                        </div>
                      </div>
                    )}

                    {/* REAL LIVE RESULTS */}
                    {verificationResult && (
                      <div className="space-y-6 animate-in fade-in zoom-in-95">
                        
                        {/* VERDICT BANNER */}
                        <div className={`p-4 sm:p-5 rounded-2xl border flex items-start space-x-3.5 ${
                          verificationResult.riskLevel === 'LOW' ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-300' :
                          verificationResult.riskLevel === 'MEDIUM' ? 'bg-amber-950/30 border-amber-500/40 text-amber-300' :
                          'bg-rose-950/30 border-rose-500/40 text-rose-300'
                        }`}>
                          <div className={`p-2 rounded-xl text-white ${
                            verificationResult.riskLevel === 'LOW' ? 'bg-emerald-600' :
                            verificationResult.riskLevel === 'MEDIUM' ? 'bg-amber-600' : 'bg-rose-600'
                          }`}>
                            <i data-lucide={
                              verificationResult.riskLevel === 'LOW' ? 'check-circle' :
                              verificationResult.riskLevel === 'MEDIUM' ? 'alert-circle' : 'alert-octagon'
                            } className="w-5 h-5"></i>
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center justify-between">
                              <h3 className="font-bold text-sm text-white">
                                {verificationResult.riskLevel === 'LOW' ? 'Document Verified — Authentic' :
                                 verificationResult.riskLevel === 'MEDIUM' ? 'Warning — Investigator Review Recommended' :
                                 'High Risk Alert — Potential Fake / Tampered Document'}
                              </h3>
                              <span className="text-[11px] font-mono uppercase px-2 py-0.5 rounded bg-black/40 border border-white/10">
                                {verificationResult.investigationStatus}
                              </span>
                            </div>
                            <p className="text-xs opacity-90 mt-1">
                              Risk Score: <span className="font-bold font-mono">{verificationResult.riskScore}/100</span> | 
                              Classification: <span className="font-bold">{verificationResult.riskLevel}</span>
                            </p>
                          </div>
                        </div>

                        {/* METRICS ROW (3 GAUGES) */}
                        <div className="grid grid-cols-3 gap-3 sm:gap-4">
                          <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 text-center">
                            <div className="text-[11px] text-slate-400 font-medium">Face Biometric</div>
                            <div className="text-base sm:text-lg font-bold text-white mt-1 font-mono">
                              {(verificationResult.faceMatchConfidence * 100).toFixed(1)}%
                            </div>
                            <div className={`text-[10px] font-semibold mt-0.5 ${verificationResult.faceMatched ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {verificationResult.faceMatched ? 'Matched' : 'Mismatch'}
                            </div>
                          </div>

                          <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 text-center">
                            <div className="text-[11px] text-slate-400 font-medium">Tamper Risk</div>
                            <div className="text-base sm:text-lg font-bold text-white mt-1 font-mono">
                              {(verificationResult.tamperingConfidence * 100).toFixed(1)}%
                            </div>
                            <div className={`text-[10px] font-semibold mt-0.5 ${!verificationResult.tamperingDetected ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {!verificationResult.tamperingDetected ? 'Clean' : 'Tampered'}
                            </div>
                          </div>

                          <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 text-center">
                            <div className="text-[11px] text-slate-400 font-medium">Authenticity Index</div>
                            <div className="text-base sm:text-lg font-bold text-emerald-400 mt-1 font-mono">
                              {Math.max(0, 100 - verificationResult.riskScore)}%
                            </div>
                            <div className="text-[10px] text-slate-400 mt-0.5">Confidence</div>
                          </div>
                        </div>

                        {/* EXTRACTED OCR & METADATA SECTION */}
                        <div className="space-y-2">
                          <h4 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                            <span>Extracted OCR & Identity Fields</span>
                            <span className="text-[10px] text-indigo-400 font-mono">AI Vision Extraction</span>
                          </h4>

                          <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800/80 space-y-2 text-xs">
                            <div className="flex justify-between py-1 border-b border-slate-800/60">
                              <span className="text-slate-400">Citizen Full Name</span>
                              <span className="font-semibold text-white font-mono">{verificationResult.ocrData?.name || 'N/A'}</span>
                            </div>
                            <div className="flex justify-between py-1 border-b border-slate-800/60">
                              <span className="text-slate-400">Document Identifier</span>
                              <span className="font-semibold text-indigo-300 font-mono">{verificationResult.ocrData?.documentNumber || 'N/A'}</span>
                            </div>
                            <div className="flex justify-between py-1 border-b border-slate-800/60">
                              <span className="text-slate-400">Date of Birth</span>
                              <span className="font-semibold text-white font-mono">{verificationResult.ocrData?.dateOfBirth || 'N/A'}</span>
                            </div>
                            <div className="flex justify-between py-1 border-b border-slate-800/60">
                              <span className="text-slate-400">Document Type</span>
                              <span className="font-semibold text-white">{verificationResult.documentType}</span>
                            </div>
                            {uploadedDocMeta?.sha256Checksum && (
                              <div className="flex justify-between py-1">
                                <span className="text-slate-400">SHA-256 Anti-Tamper Checksum</span>
                                <span className="font-mono text-[10px] text-slate-400 truncate max-w-[200px]" title={uploadedDocMeta.sha256Checksum}>
                                  {uploadedDocMeta.sha256Checksum}
                                </span>
                              </div>
                            )}
                          </div>
                        </div>

                        {/* SECURITY & RISK INTEGRITY SIGNALS */}
                        <div className="space-y-2">
                          <h4 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                            Security Integrity Checks
                          </h4>

                          <div className="space-y-1.5 text-xs">
                            <div className="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800 flex items-center justify-between">
                              <span className="text-slate-300 flex items-center gap-2">
                                <i data-lucide="check" className="w-3.5 h-3.5 text-emerald-400"></i>
                                Magic-Byte File Signature Verification
                              </span>
                              <span className="text-[10px] font-mono text-emerald-400 font-semibold">PASSED</span>
                            </div>

                            <div className="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800 flex items-center justify-between">
                              <span className="text-slate-300 flex items-center gap-2">
                                <i data-lucide="check" className="w-3.5 h-3.5 text-emerald-400"></i>
                                Cryptographic SHA-256 Digest Verification
                              </span>
                              <span className="text-[10px] font-mono text-emerald-400 font-semibold">MATCHED</span>
                            </div>

                            <div className="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800 flex items-center justify-between">
                              <span className="text-slate-300 flex items-center gap-2">
                                <i data-lucide={verificationResult.tamperingDetected ? 'x' : 'check'} className={`w-3.5 h-3.5 ${verificationResult.tamperingDetected ? 'text-rose-400' : 'text-emerald-400'}`}></i>
                                AI Neural Tamper & Pixel Noise Inspection
                              </span>
                              <span className={`text-[10px] font-mono font-semibold ${verificationResult.tamperingDetected ? 'text-rose-400' : 'text-emerald-400'}`}>
                                {verificationResult.tamperingDetected ? 'ANOMALY DETECTED' : 'CLEAN'}
                              </span>
                            </div>

                            {verificationResult.reasons?.map((reason, idx) => (
                              <div key={idx} className="p-2.5 rounded-xl bg-indigo-950/20 border border-indigo-900/30 text-indigo-300 text-[11px] flex items-center gap-2">
                                <i data-lucide="info" className="w-3.5 h-3.5 text-indigo-400 flex-shrink-0"></i>
                                <span>Signal: {reason}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                      </div>
                    )}
                  </div>

                  {/* OFFICER DECISION ACTIONS BAR (Only for Investigator & Admin) */}
                  {verificationResult && (currentUser.role === 'ROLE_INVESTIGATOR' || currentUser.role === 'ROLE_ADMIN') && (
                    <div className="pt-4 border-t border-slate-800 mt-6 space-y-2">
                      <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                        <span>Investigator Workflow Decisions</span>
                        <span className="text-[10px] text-blue-400 font-mono">PATCH /api/verifications/{verificationResult.id}/status</span>
                      </div>
                      <div className="grid grid-cols-3 gap-2">
                        <button
                          type="button"
                          onClick={() => handleOfficerDecision('VERIFIED', 'Manual biometric review confirmed identity.')}
                          className="py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow"
                        >
                          <i data-lucide="check" className="w-3.5 h-3.5"></i>
                          Approve Authentic
                        </button>
                        <button
                          type="button"
                          onClick={() => handleOfficerDecision('REVIEW_REQUIRED', 'Marked for forensic lab physical verification.')}
                          className="py-2 px-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow"
                        >
                          <i data-lucide="clock" className="w-3.5 h-3.5"></i>
                          Flag for Review
                        </button>
                        <button
                          type="button"
                          onClick={() => handleOfficerDecision('REJECTED', 'Tampering confirmed. Identity document rejected.')}
                          className="py-2 px-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow"
                        >
                          <i data-lucide="x" className="w-3.5 h-3.5"></i>
                          Reject as Fake
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

            </div>
          </main>

          {/* AUDIT LOG MODAL (FOR ADMIN) */}
          {showAuditModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card bg-slate-900 border border-slate-700/80 rounded-3xl max-w-4xl w-full p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-white flex items-center gap-2">
                      <i data-lucide="shield" className="w-5 h-5 text-purple-400"></i>
                      Append-Only System Audit Trail
                    </h3>
                    <p className="text-xs text-slate-400">Forensically logged events stored in PostgreSQL</p>
                  </div>
                  <button
                    onClick={() => setShowAuditModal(false)}
                    className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                  >
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                  {loadingLogs ? (
                    <div className="py-12 text-center text-xs text-slate-400">Loading audit records...</div>
                  ) : auditLogs.length === 0 ? (
                    <div className="py-12 text-center text-xs text-slate-400">No audit events recorded yet.</div>
                  ) : (
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400 text-[10px] uppercase font-mono">
                          <th className="py-2">Timestamp</th>
                          <th className="py-2">Event</th>
                          <th className="py-2">Actor</th>
                          <th className="py-2">Entity ID</th>
                          <th className="py-2">Details</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 font-mono text-[11px]">
                        {auditLogs.map((log) => (
                          <tr key={log.id} className="hover:bg-slate-800/40">
                            <td className="py-2 text-slate-400 whitespace-nowrap">
                              {new Date(log.timestamp).toLocaleTimeString()}
                            </td>
                            <td className="py-2">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-950 text-indigo-300 border border-indigo-900/60">
                                {log.eventType}
                              </span>
                            </td>
                            <td className="py-2 text-slate-300 truncate max-w-[140px]">{log.userEmail}</td>
                            <td className="py-2 text-indigo-400">#{log.entityId}</td>
                            <td className="py-2 text-slate-400 truncate max-w-[200px]">{log.details}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 px-4 py-4 text-center text-xs text-slate-500">
            SIH26188 — AI-Based Fake Identity & Document Screening System | Security Gateway & Risk Engine
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
