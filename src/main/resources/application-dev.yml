# Dev profile with seamless in-memory database and 24-hour token expiry for smooth testing
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:h2:mem:idshield_db;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:create-drop}

application:
  security:
    jwt:
      access-token-expiration: 86400000 # 24 hours for dev testing

logging:
  level:
    com.project: INFO
    org.springframework.security: INFO
